[package]
name = "rphotos"
version = "0.1.0-dev"
edition = "2021"
description = "Local-first cross-platform photo viewer based on ViewSkater"
license = "MIT OR Apache-2.0"

[features]
# Cosmetics for the store build. A normal `cargo build` never enables it
# and shows the plain UI.
official = []

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "persistence",
] }
egui = "0.31"
egui-winit = { version = "0.31", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "webp",
    "gif",
    "tiff",
    "qoi",
    "tga",
] }
jxl-oxide = { version = "0.12.5", features = ["image"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
natord = "1.0"
rfd = "0.15"
webbrowser = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = "0.4"
dirs = "6"
sysinfo = "0.33"
libc = "0.2"
wgpu = { version = "24", default-features = false, features = ["counters"] }
mimalloc = { version = "0.1", default-features = false }
trash = "5.2.9"
kamadak-exif = "0.6.1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
notify = "8.2"
lcms2 = { version = "6.2", features = ["static"] }
libloading = "0.8"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "=0.6.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "0.4"
raw-window-handle = "0.6"
wayland-client = "0.31.13"
wayland-backend = { version = "0.3.14", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3.11", features = ["client"] }
wayland-protocols = { version = "0.32.11", features = ["client", "staging"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = ["ApplicationModel_DataTransfer", "Foundation_Collections", "Storage", "Win32_UI_Shell", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.31.1", features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSArray",
    "NSString",
    "NSDictionary",
    "NSUserDefaults",
    "NSURL",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSSharingService",
] }
raw-window-handle = "0.6"

[build-dependencies]
chrono = "0.4"
winres = "0.1"

[patch.crates-io]
winit = { git = "https://github.com/ggand0/winit.git", branch = "custom-dnd-0.30.13" }
egui-winit = { git = "https://github.com/ggand0/egui-winit-custom.git", branch = "main" }

[package.metadata.appimage]
icon = "./assets/rphotos.png"

[package.metadata.bundle]
name = "Rphotos"
identifier = "org.rphotos.Rphotos"
icon = ["assets/Rphotos.icns"]
short_description = "A local-first cross-platform photo viewer"
# NOTE: cargo-bundle 0.6.1 has no hook for extending the generated Info.plist.
# scripts/bundle-macos.sh merges resources/macos/Info.plist after bundling to
# inject CFBundleDocumentTypes.

[profile.release]
lto = "fat"
codegen-units = 1

[profile.opt-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
